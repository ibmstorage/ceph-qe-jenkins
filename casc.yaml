jenkins:
  systemMessage: "Controlled by Configuration as Code. Do not install or configure items manually as it would be lost."

  # Add retries for Source code checkout
  scmCheckoutRetryCount: 2
  
  # Enable execution server side exclusively for vault token
  # It should not be blocked by an executor. No other job should use it.
  numExecutors: 0
  quietPeriod: 0

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  securityRealm:
    github:
      githubWebUri: "https://github.ibm.com"
      githubApiUri: "https://api.github.ibm.com/api/v3"
      clientID: "9b8b8842d5bfe366ce3c"
      clientSecret: "7daba8a4c1aa1692c34c4791be7910f6ffd7f2cc"
      oauthScopes: "read:org,user:email,repo"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Jenkins Administrator"
            permissions:
              - "Overall/Administer"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ng-admins"
          - name: "qe-team"
            description: "Users of the CI."
            permissions:
              - "Overall/Read"
              - "Credentials/View"
              - "Job/Build"
              - "Job/Discover"
              - "Job/Read"
              - "Run/Update"
              - "Run/Replay"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ibm"

  slaveAgentPort: -1

  disabledAdministrativeMonitors:
    - "jenkins.diagnostics.ControllerExecutorsNoAgents"
    - "jenkins.security.s2m.MasterKillSwitchWarning"

  labelAtoms:
    - name: "agents"

  nodes:
    - permanent:
        labelString: "agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: 10.243.80.4
            port: 22022
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "agent-vm-01"
        nodeDescription: "Workflow executor"
        numExecutors: 1
        remoteFS: "/home/jenkins/agent"
        retentionStrategy: "always"
    - permanent:
        labelString: "agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: 10.243.80.4
            port: 23022
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "agent-vm-02"
        nodeDescription: "Workflow executor"
        numExecutors: 1
        remoteFS: "/home/jenkins/agent"
        retentionStrategy: "always"

appearance:
  consoleUrlProvider:
    providers:
      - "pipelineGraphView"
  pipelineGraphView:
    showGraphOnBuildPage: true
    showGraphOnJobPage: true
  prism:
    theme: PRISM
  themeManager:
    disableUserThemes: false
    theme: "dark"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              description: "Ceph QE SA account - VM access"
              id: "vmLoginAccessKey"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/secrets/ceph_qe_sa_ssh_key}"
              scope: GLOBAL
              username: cephuser
              usernameSecret: false

          - basicSSHUserPrivateKey:
              description: "Ceph QE SA SVC account - VM access"
              id: "vmLoginAccessKey2"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/secrets/ceph_qe_sa_svc_ssh_key}"
              scope: GLOBAL
              username: cephuser
              usernameSecret: false

          - file:
              description: "CephCI global credential file."
              id: "osp-cred"
              fileName: "osp-creds.yaml"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/global_creds}"

          - file:
              description: "CephCI credential file"
              id: "cephci-conf"
              fileName: ".cephci.yaml"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/cephci_conf}"

          - string:
              description: "Access Token - icr-stg"
              id: "stg-icr-token"
              scope: GLOBAL
              secret: "${readFile:/secrets/stg_icr_io_passwd}"

          - string:
              description: "Access Token - icr"
              id: "icr-token"
              scope: GLOBAL
              secret: "${readFile:/secrets/icr_io_passwd}"

          - usernamePassword:
              description: "Brew Registry access"
              id: "brew-access"
              scope: GLOBAL
              username: "${readFile:/secrets/brew_username}"
              password: "${readFile:/secrets/brew_password}"

          - usernamePassword:
              description: "Github IBM ceph-qe-sa PAT"
              id: "ceph-qe-sa-pat"
              scope: GLOBAL
              username: "${readFile:/secrets/github_ibm_username}"
              password: "${readFile:/secrets/github_ibm_pat}"

          - usernamePassword:
              description: "Red Hat CDN access details"
              id: "rh-cdn-access"
              scope: GLOBAL
              username: "${readFile:/secrets/rh_cdn_username}"
              password: "${readFile:/secrets/rh_cdn_passwd}"

          - usernamePassword:
              description: "IBM Container Registry - Stage access"
              id: "ibm-cp-stg-icr"
              scope: GLOBAL
              username: cp
              password: "${readFile:/secrets/stg_icr_io_passwd}"

          - usernamePassword:
              description: "IBM Container Registry - Prod"
              id: "ibm-cp-icr"
              scope: GLOBAL
              username: cp
              password: "${readFile:/secrets/icr_io_passwd}"

          - basicSSHUserPrivateKey:
              description: "SSH Private key for agent access"
              id: "jenkinsAgentSSHKey"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/secrets/agent_access_key}"
              scope: SYSTEM
              username: jenkins
              usernameSecret: true

security:
  globalJobDslSecurityConfiguration:
    # Permit Job DSL to be run without the hassle of script security
    useScriptSecurity: false
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "noHostKeyVerificationStrategy"
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
  scriptApproval:
    approvedSignatures:
      - method java.io.File getName
      - new java.lang.RuntimeException java.lang.String
      - method org.jsoup.Connection get
      - method org.yaml.snakeyaml.Yaml dump java.lang.Object
      - staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods findAll java.lang.String java.lang.String
      - staticMethod org.jsoup.Jsoup connect java.lang.String

unclassified:
  email-ext:
    mailAccount:
      smtpHost: "smtp.corp.ibm.com"

  globalLibraries:
    libraries:
      - name: "ceph-qe-libs"
        defaultVersion: "main"
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.ibm.com/ceph-qe-ng/jenkins.git"
                credentialsId: "ceph-qe-sa-pat"

  location:
    adminAddress: "Ceph Qe Infra <ceph-qe-infra@ibm.com>"
    url: "https://149.81.216.83/"

  mailer:
    charset: "UTF-8"
    defaultSuffix: "@ibm.com"
    smtpHost: "smtp.corp.ibm.com"
    useSsl: false

  scmGit:
    globalConfigEmail: "ceph-qe-sa@ibm.com"
    globalConfigName: "ceph-qe-sa"

  shell:
    shell: "bash"

  timestamper:
    allPipelines: false
    elapsedTimeFormat: "'<b>'HH:mm:ss'</b>'"
    systemTimeFormat: "'<b>'HH:mm:ss'</b>'"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"

jobs:
  - file: /usr/share/jenkins/seed.groovy
