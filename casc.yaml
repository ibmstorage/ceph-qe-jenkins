              id: "ibm-cp-stg-icr"
              scope: GLOBAL
              username: cp
              password: "${readFile:/secrets/stg_icr_io_passwd}"

          - usernamePassword:
              description: "IBM Container Registry - Prod"
              id: "ibm-cp-icr"
              scope: GLOBAL
              username: cp
              password: "${readFile:/secrets/icr_io_passwd}"

          - usernamePassword:
              description: "IBM Cloud SendGrid API Key"
              id: "send-grid-api"
