jenkins:
  systemMessage: "Controlled by Configuration as Code. Do not install or configure items manually as it would be lost."
  numExecutors: 0
  quietPeriod: 0

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  securityRealm:
    github:
      githubWebUri: "https://github.ibm.com"
      githubApiUri: "https://api.github.ibm.com/api/v3"
      clientID: "9b8b8842d5bfe366ce3c"
      clientSecret: "7daba8a4c1aa1692c34c4791be7910f6ffd7f2cc"
      oauthScopes: "read:org,user:email,repo"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Jenkins Administrator"
            permissions:
              - "Overall/Administer"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ng-admins"
          - name: "qe-team"
            description: "Users of the CI."
            permissions:
              - "Overall/Read"
              - "Credentials/View"
              - "Job/Build"
              - "Job/Discover"
              - "Job/Read"
              - "Run/Update"
              - "Run/Replay"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ibm"

  slaveAgentPort: 50000

  nodes:
    - permanent:
        labelString:  "agent-vm-01 agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: "10.243.80.9"
            launchTimeoutSeconds: 60
            maxNumRetries: 3
            port: 22
            retryWaitTime: 30
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
        name: "agent-vm-01"
        nodeDescription: "Workflow executor"
        numExecutors: 5
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"
    - permanent:
        labelString:  "agent-vm-02 agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: "10.243.80.10"
            launchTimeoutSeconds: 60
            maxNumRetries: 3
            port: 22
            retryWaitTime: 30
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
        name: "agent-vm-02"
        nodeDescription: "Workflow executor"
        numExecutors: 5
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"

appearance:
  themeManager:
    disableUserThemes: true
    theme: darkSystem

credentials:
  system:
    domainCredentials:
      - credentials:
          - vaultTokenCredential:
              description: "Secrets Manager Vault Token"
              id: "SMAccessToken"
              scope: GLOBAL
              token: "some dummy value. Needs to be dynamic"
          - usernamePassword:
              description: "Github IBM ceph-qe-sa PAT"
              id: "ceph-qe-sa-pat"
              scope: GLOBAL
              username: "ceph-qe-sa@ibm.com"
              password: "${GHI-PAT}"
          - string:
              description: "IBM Cloud SecretsManager Reader API Key"
              id: "SMAPIKey"
              scope: GLOBAL
              secret: "${SecretsManagerIAMKey}"
          - basicSSHUserPrivateKey:
              description: "SSH Private key for agent access"
              id: "jenkinsAgentSSHKey"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:${JENKINS_SSH_KEY}}"
              scope: SYSTEM
              username: jenkins
              usernameSecret: true
          - file:
              scope: GLOBAL
              id: "ibmc-api-creds"
              fileName: "ibmc_api_creds"
              secretBytes: "${readFile:${IBMC_API_CREDS}}"

security:
  globalJobDslSecurityConfiguration:
    # Permit Job DSL to be run without the hassle of script security
    useScriptSecurity: false
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "noHostKeyVerificationStrategy"
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
  scriptApproval:
    approvedSignatures:
      - method java.io.File getName
      - new java.lang.RuntimeException java.lang.String
      - method org.jsoup.Connection get
      - method org.yaml.snakeyaml.Yaml dump java.lang.Object
      - staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods findAll java.lang.String java.lang.String
      - staticMethod org.jsoup.Jsoup connect java.lang.String

unclassified:
  email-ext:
    mailAccount:
      smtpHost: "smtp.corp.ibm.com"

  globalLibraries:
    libraries:
      - name: "ceph-qe-libs"
        defaultVersion: "main"
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.ibm.com/ceph-qe-ng/jenkins.git"
                credentialsId: "ceph-qe-sa-pat"

  hashicorpVault:
    configuration:
      disableChildPoliciesOverride: false
      engineVersion: 2
      timeout: 60
      vaultCredentialId: "SMAccessToken"
      vaultUrl: "https://b4fc7484-5e05-41a3-a3bd-bcb72f6fc466.us-south.secrets-manager.appdomain.cloud"

  location:
    adminAddress: "Ceph Qe Infra <ceph-qe-infra@ibm.com>"
    url: "https://149.81.216.83:8443/"

  mailer:
    charset: "UTF-8"
    defaultSuffix: "@ibm.com"
    smtpHost: "smtp.corp.ibm.com"
    useSsl: false

  scmGit:
    globalConfigEmail: "ceph-qe-sa@ibm.com"
    globalConfigName: "ceph-qe-sa"

  shell:
    shell: "bash"

tool:
  git:
    installations:
      - name: git
        home: /usr/bin/git

jobs:
  - file: /usr/share/jenkins/seed.groovy
