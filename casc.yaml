jenkins:
  systemMessage: "Controlled by Configuration as Code. Do not install or configure items manually as it would be lost."

  # Add retries for Source code checkout
  scmCheckoutRetryCount: 2
  
  # Enable execution server side exclusively for vault token
  # It should not be blocked by an executor. No other job should use it.
  numExecutors: 0
  quietPeriod: 0

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  securityRealm:
    github:
      githubWebUri: "https://github.ibm.com"
      githubApiUri: "https://api.github.ibm.com/api/v3"
      clientID: "9b8b8842d5bfe366ce3c"
      clientSecret: "7daba8a4c1aa1692c34c4791be7910f6ffd7f2cc"
      oauthScopes: "read:org,user:email,repo"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Jenkins Administrator"
            permissions:
              - "Overall/Administer"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ng-admins"
          - name: "qe-team"
            description: "Users of the CI."
            permissions:
              - "Overall/Read"
              - "Credentials/View"
              - "Job/Build"
              - "Job/Configure"
              - "Job/Discover"
              - "Job/Read"
              - "Job/Cancel"
              - "Run/Update"
              - "Run/Replay"
            entries:
              - group: "ceph-qe-ng*ceph-qe-ibm"
              - group: "ceph-qe-ng*build-team"

  slaveAgentPort: -1

  disabledAdministrativeMonitors:
    - "jenkins.diagnostics.ControllerExecutorsNoAgents"
    - "jenkins.security.s2m.MasterKillSwitchWarning"

  labelAtoms:
    - name: "agents"

  nodes:
    - permanent:
        labelString: "agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: 10.243.80.29
            port: 22
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "infra-vm-jenkins-agent-01"
        nodeDescription: "Workflow executor"
        numExecutors: 10
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"
    - permanent:
        labelString: "infra"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: 10.243.80.46
            port: 22
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "infra-vm-jenkins-agent-02"
        nodeDescription: "Workflow executor for infra jobs only."
        numExecutors: 5
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"
    - permanent:
        labelString: "agents"
        launcher:
          ssh:
            credentialsId: "jenkinsAgentSSHKey"
            host: 10.243.80.47
            port: 22
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "infra-vm-jenkins-agent-03"
        nodeDescription: "Workflow executor"
        numExecutors: 10
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"
    - permanent:
        labelString: "agents-aws"
        launcher:
          ssh:
            credentialsId: "awsAgentSSHKey"
            host: 16.170.108.62
            port: 22
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        name: "infra-vm-jenkins-agent-aws-01"
        nodeDescription: "Workflow executor for AWS jobs only."
        numExecutors: 5
        remoteFS: "/data/jenkins"
        retentionStrategy: "always"

appearance:
  consoleUrlProvider:
    providers:
      - "pipelineGraphView"
  pipelineGraphView:
    showGraphOnBuildPage: true
    showGraphOnJobPage: true
  prism:
    theme: PRISM
  themeManager:
    disableUserThemes: false
    theme: "dark"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              description: "Ceph QE SA account - VM access"
              id: "vmLoginAccessKey"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/secrets/ceph_qe_sa_ssh_key}"
              scope: GLOBAL
              username: cephuser
              usernameSecret: false

          - basicSSHUserPrivateKey:
              description: "Ceph QE SA SVC account - VM access"
              id: "vmLoginAccessKey2"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/secrets/ceph_qe_sa_svc_ssh_key}"
              scope: GLOBAL
              username: cephuser
              usernameSecret: false

          - file:
              description: "CephCI global credential file."
              id: "osp-cred"
              fileName: "osp-creds.yaml"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/global_creds}"

          - file:
              description: "CephCI credential file"
              id: "cephci-conf"
              fileName: ".cephci.yaml"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/cephci_conf}"

          - file:
              description: "All Registries authentication file."
              id: "all-cr-auth"
              fileName: "auth.json"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/all_registry_auth}"

          - file:
              description: "Red Hat Google Platform - Service Account"
              id: "gcp-service-account"
              fileName: "gcp_service_account.json"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/gcp_service_account}"

          - file:
              description: "Repo access key for synchronization"
              id: "repo_access_key"
              fileName: "repo_access_key"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/repo_access}"

          - file:
              description: "CephCI Global Credentails file for AWS"
              id: "aws-osp-cred"
              fileName: "osp-cred"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/aws_global_creds}"

          - file:
              description: "gklm certificate"
              id: "rgw-gklm-auth"
              fileName: "rgw-gklm-auth-crt"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/rgw-gklm-auth-crt}"
          - file:
              description: "gklm key"
              id: "rgw-gklm-key"
              fileName: "rgw-gklm-auth-key"
              scope: GLOBAL
              secretBytes: "${readFileBase64:/secrets/rgw-gklm-auth-key}"

          - string:
