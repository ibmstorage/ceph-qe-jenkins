regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Regression Suite 1"
      suite: suites/squid/cephfs/regression_suite_1.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Regression Suite NFS"
      suite: suites/squid/cephfs/regression_suite_nfs.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Regression Suite 2"
      suite: suites/squid/cephfs/regression_suite_2.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Regression Suite 3"
      suite: suites/squid/cephfs/regression_suite_3.yaml
      vm-size:
        ibmc: cx2-4x8
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "New Feature suite - 8.1"
      suite: suites/squid/cephfs/8_1_features_suite.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs Mirroring"
      suite: suites/squid/cephfs/tier-1_cephfs_mirror.yaml
      global-conf: conf/squid/cephfs/tier-1_cephfs_mirror.yaml
    - name: "Test Cephfs with Erasure"
      suite: suites/squid/cephfs/tier-2_fs_erasure.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
extended_regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Test cephfs top"
      suite: suites/squid/cephfs/tier-3_cephfs_test_cephfs-top.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs Recovery"
      suite: suites/squid/cephfs/tier-4_cephfs_recovery.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs CG Quiesce"
      suite: suites/squid/cephfs/tier-1_cephfs_cg_quiesce_systemic.yaml
      global-conf: conf/squid/cephfs/tier-1_cephfs_cg_quiesce.yaml
    - name: "Test Cephfs Metrics"
      suite: suites/squid/cephfs/tier-2_cephfs_test-metrics.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test cephfs performance"
      suite: suites/squid/cephfs/tier-3_cephfs_test_performance.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs MDS Pinning"
      suite: suites/squid/cephfs/tier-2_cephfs_test_mds_pinning.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs Scale"
      suite: suites/squid/cephfs/tier-3_cephfs_scale.yaml
      global-conf: conf/squid/cephfs/tier-0_fs.yaml
    - name: "Test Cephfs Bugs"
      suite: suites/squid/cephfs/tier-3_cephfs_bugs.yaml
      global-conf: conf/squid/cephfs/tier-3_cephfs_4clients_4osd.yaml
    - name: "Test Cephfs Mirror HA"
      suite: suites/squid/cephfs/tier-2_cephfs_mirror_ha.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_mirror_ha.yaml
    - name: "Test Cephfs Generic"
      suite: suites/squid/cephfs/tier-2_cephfs_generic.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Test Cephfs System"
      suite: suites/squid/cephfs/tier-4_cephfs_system.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_upgrade.yaml
    - name: "Test Cephfs Ops"
      suite: suites/squid/cephfs/tier-3_cephfs.yaml
      global-conf: conf/squid/cephfs/tier-3_cephfs_4clients_4osd.yaml
    - name: "Test Cephfs Mirror Metrics"
      suite: suites/squid/cephfs/tier-2_cephfs_mirror_metrics.yaml
      global-conf: conf/squid/cephfs/tier-1_cephfs_mirror.yaml
    - name: "Test Cephfs Mirror HA Metrics"
      suite: suites/squid/cephfs/tier-2_cephfs_mirror_ha_metrics.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_mirror_ha.yaml
    - name: "Test Cephfs Multi MDS"
      suite: suites/squid/cephfs/tier-2_cephfs_test-multi-mds.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_8mds-cluster.yaml
    - name: "Test cephfs Kernel"
      suite: suites/squid/cephfs/tier-1_fs_kernel_pipeline.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_7-node-cluster.yaml
upgrade:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Test Cephfs Upgrade 6x to 8x"
      suite: suites/squid/cephfs/tier-0_cephfs_upgrade_6x_to_8x.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_upgrade.yaml
      platform:
        - rhel-9
      vm-size:
        ibmc: cx2-4x8
    - name: "Test Cephfs Upgrade 7.1x to 8x"
      suite: suites/squid/cephfs/tier-0_cephfs_upgrade_71_to_8x.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_upgrade.yaml
      platform:
        - rhel-9
      vm-size:
        ibmc: cx2-4x8
    - name: "Test Cephfs Upgrade 8x Latest to 8.1x Latest"
      suite: suites/squid/cephfs/tier-0_cephfs_upgrade_8x_latest_to_81x_latest.yaml
      global-conf: conf/squid/cephfs/tier-2_cephfs_upgrade.yaml
      platform:
        - rhel-9
      vm-size:
        ibmc: cx2-4x8
    - name: "Test Cephfs Mirror Upgrade 6x to 7x to 8x"
      suite: suites/squid/cephfs/tier-0_cephfs_mirrror_upgrade_6x_to_7x_to_8x.yaml
      global-conf: conf/squid/cephfs/tier-1_cephfs_mirror.yaml
      platform:
        - rhel-9
      vm-size:
        ibmc: cx2-4x8
