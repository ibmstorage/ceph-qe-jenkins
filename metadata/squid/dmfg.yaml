    #   suite: suites/squid/ceph_volume/tier2-ceph-volume-non-collocated.yaml
    #   global-conf: conf/squid/ceph_volume/1admin-1client-5node-single-volume.yaml
    # - name: "Test DMFG Tier-2 Ceph-Volume lvm"
    #   suite: suites/squid/ceph_volume/tier2-ceph-volume-lvm.yaml
    #   global-conf: conf/squid/ceph_volume/2admin-5node-1client.yaml
    - name: "Test DMFG Tier-4 Service Operations"
      suite: suites/squid/cephadm/tier4-service-operations.yaml
      global-conf: conf/squid/cephadm/1admin-4node-1client-cluster.yaml

