bvt:
  metadata:
    cloud:
      - ibmc
  suites:
    - name: "Build Verfification Test"
      suite: suites/squid/smoke/bvt.yaml
      global-conf: conf/squid/common/3node-1client.yaml
      platform:
        - rhel-9
      tags:
        - bvt

sanity:
  metadata:
    cloud:
      - ibmc
  suites:
    - name: "Tier-1 Service Apply Spec"
      suite: suites/squid/cephadm/tier1-service-apply-spec.yaml
      global-conf: conf/squid/cephadm/2admin-3node-1rgw-1client-sanity.yaml
      platform:
        - rhel-9
    - name: "Tier-1 CephFS Test"
      suite: suites/squid/cephfs/tier-0_fs.yaml
      global-conf: conf/squid/cephfs/tier-0_fs.yaml
      platform:
        - rhel-9
    - name: "Tier-0 NFS Ganesha"
      suite: suites/squid/nfs/tier0-nfs-ganesha.yaml
      global-conf: conf/squid/nfs/1admin-7node-3client.yaml
      platform:
        - rhel-9
    - name: "Tier-0 NFS Ganesha v3"
      suite: suites/squid/nfs/tier0-nfs-ganesha-v3.yaml
      global-conf: conf/squid/nfs/1admin-7node-3client.yaml
      platform:
        - rhel-9
    - name: "Tier-0 NFS Ganesha v4"
      suite: suites/squid/nfs/tier0-nfs-ganesha-vers-4-2.yaml
      global-conf: conf/squid/nfs/1admin-7node-3client.yaml
      platform:
        - rhel-9
    - name: "Basic E2E Test NVMEoF Gateway and Run IOs on targets"
      suite: suites/squid/nvmeof/tier-1_nvmeof_sanity.yaml
      global-conf: conf/squid/nvmeof/ceph_nvmeof_sanity.yaml
      vm-flavor: bx2-4x16
      platform:
        - rhel-9
      build:
        - ibm
    - name: "NVMe Basic E2E-Test with FIPS mode enabled"
      suite: suites/squid/nvmeof/tier-2_nvmeof_e2e_fips.yaml
      global-conf: conf/squid/nvmeof/ceph_nvmeof_sanity.yaml
      custom-config:
        enable-fips-mode: true
      vm-flavor: bx2-4x16
      platform:
        - rhel-9
      build:
        - ibm
    - name: "HA test - 2 NVMe Gateway High availability Sanity"
      suite: suites/squid/nvmeof/tier-1_nvmeof_ha_sanity.yaml
      global-conf: conf/squid/nvmeof/ceph_nvmeof_ha_cluster.yaml
      vm-flavor: bx2-4x16
      platform:
        - rhel-9
      build:
        - ibm
    - name: "Tier-2 RADOS Basic Regression"
      suite: suites/squid/rados/tier-2-rados-basic-regression.yaml
      global-conf: conf/squid/rados/7-node-cluster.yaml
      platform:
        - rhel-9
    - name: "Tier-1 RBD"
      suite: suites/squid/rbd/tier-1_rbd.yaml
      global-conf: conf/squid/rbd/4-node-cluster-with-1-client.yaml
      platform:
        - rhel-9
    - name: "Tier-1 iSCSI"
      suite: suites/squid/iscsi/iscsi_sanity.yaml
      global-conf: conf/squid/iscsi/ceph_iscsi_functional.yaml
      platform:
        - rhel-9
      build:
        - ibm
    - name: "Tier-1 RBD Mirror"
      suite: suites/squid/rbd/tier-1_rbd_mirror.yaml
      global-conf: conf/squid/rbd/5-node-2-clusters.yaml
      platform:
        - rhel-9
    - name: "Tier-1 RGW"
      suite: suites/squid/rgw/tier-1_rgw.yaml
      global-conf: conf/squid/rgw/tier-0_rgw.yaml
      platform:
        - rhel-9
      build:
        - rh
    - name: "Tier-1 RGW Multisite"
      suite: suites/squid/rgw/tier-1_rgw_multisite.yaml
      global-conf: conf/squid/rgw/rgw_multisite.yaml
      platform:
        - rhel-9
      build:
        - rh
    - name: "Tier-2 RGW MS Upgrade"
      suite: suites/squid/rgw/tier-2_rgw_ms_upgrade_8xsanity_to_8xlatest.yaml
      global-conf: conf/squid/rgw/rgw_multisite.yaml
      platform:
        - rhel-9
      build:
        - rh
    - name: "Tier-2 RGW Upgrade"
      suite: suites/squid/rgw/tier-2_rgw_upgrade_8xsanity_to_8xlatest.yaml
      global-conf: conf/squid/rgw/tier-0_rgw.yaml
      platform:
        - rhel-9
      build:
        - rh
    - name: "Tier-1 RGW IBMC"
      suite: suites/squid/rgw/tier-1_rgw_ibm.yaml
      global-conf: conf/squid/rgw/tier-0_rgw.yaml
      platform:
        - rhel-9
      build:
        - ibm
    - name: "Tier-0 SMB"
      suite: suites/squid/smb/tier-0-smb.yaml
      global-conf: conf/squid/smb/1admin-4node-1client-cluster.yaml
      platform:
        - rhel-9
      build:
        - ibm
