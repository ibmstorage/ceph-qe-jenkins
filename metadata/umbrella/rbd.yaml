regression:
    metadata:
      cloud:
        - ibmc
        - aws
    suites:
      - name: "tier-2 rbd regression Image migration"
        suite: suites/umbrella/rbd/tier-2_rbd_regression_Image_migration.yaml
        global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      - name: "tier-2 rbd mirror image operations"
        suite: suites/umbrella/rbd/tier-2_rbd_mirror_image_operations.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd migration external ceph"
        suite: suites/umbrella/rbd/tier-2_rbd_migration_external_ceph.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd encryption"
        suite: suites/umbrella/rbd/tier-2_rbd_encryption.yaml
        global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      - name: "tier-2 rbd group mirror"
        suite: suites/umbrella/rbd/tier-2_rbd_group_mirror.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd group mirror failover"
        suite: suites/umbrella/rbd/tier-2_rbd_group_mirror_failover.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd group mirror misc"
        suite: suites/umbrella/rbd/tier-2_rbd_group_mirror_misc.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd group mirror dynamic"
        suite: suites/umbrella/rbd/tier-2_rbd_group_mirror_dynamic.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd migration key import"
        suite: suites/umbrella/rbd/tier-2_rbd_migration_key_import_9_2.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters-with-nvmeof.yaml
      - name: "tier-2 default namespace mirroring"
        suite: suites/umbrella/rbd/tier-2_default_namespace_mirroring.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd regression"
        suite: suites/umbrella/rbd/tier-2_rbd_regression.yaml
        global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      - name: "tier-2 rbd mirror snapshot regression"
        suite: suites/umbrella/rbd/tier-2_rbd_mirror_snapshot_regression.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd mirror failover recovery"
        suite: suites/umbrella/rbd/tier-2_rbd_mirror_failover_recovery.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
      - name: "tier-2 rbd namespace"
        suite: suites/umbrella/rbd/tier-2_rbd_namespace.yaml
        global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      - name: "tier-2 rbd group"
        suite: suites/umbrella/rbd/tier-2_rbd_group.yaml
        global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      - name: "tier-2 non-default namespace mirroring"
        suite: suites/umbrella/rbd/tier-2_non_default_namespace_mirroring.yaml
        global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml

