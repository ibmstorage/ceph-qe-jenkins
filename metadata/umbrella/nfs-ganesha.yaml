regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Tier-1 NFS Ganesha Phase-2 v4.2"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-phase2-v4-2.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha v3"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-v3.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha v4.2"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-v4-2.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha QoS"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-qos.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha BYOK"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-byok.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha GRPC"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-grpc.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS ganesha Scalable Stats for Prometheus"
      suite: suites/umbrella/nfs/tier2-nfs-prometheus-stats.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "NFS v4 ACL Tests"
      suite: suites/umbrella/nfs/tier0-nfs-acl.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "NFS Ganesha GRPC admin tests"
      suite: suites/umbrella/nfs/tier1-nfs-ganesha-grpc-admin.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml

