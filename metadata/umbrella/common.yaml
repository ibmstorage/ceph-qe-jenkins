bvt:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Build Verification Test RH"
      suite: suites/umbrella/smoke/bvt.yaml
      global-conf: conf/umbrella/common/3node-1client.yaml
      build:
        - rh
      tags:
        - bvt
    - name: "Build Verification Test IBM"
      suite: suites/umbrella/smoke/bvt-ibm.yaml
      global-conf: conf/umbrella/common/6node-1client.yaml
      vm-size:
        ibmc: cx2-8x16
      build:
        - ibm
      tags:
        - bvt

sanity:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "HA test - 2 NVMe Gateway High availability Sanity"
      suite: suites/umbrella/nvmeof/tier-1_nvmeof_ha_sanity.yaml
      global-conf: conf/umbrella/nvmeof/ceph_nvmeof_ha_cluster.yaml
      custom-config:
        enable-fips-mode: true
      vm-size:
        ibmc: bx2-4x16
      build:
         - ibm
    - name: "Tier-2 RADOS Basic Regression"
      suite: suites/umbrella/rados/tier-2-rados-basic-regression.yaml
      global-conf: conf/umbrella/rados/4-node-ec-cluster-1-client.yaml
      vm-size:
        ibmc: bx2-4x16
        aws: m6g.xlarge
    - name: "tier-1 rbd"
      suite: suites/umbrella/rbd/tier-1_rbd.yaml
      global-conf: conf/umbrella/rbd/4-node-cluster-with-1-client.yaml
      vm-size:
        ibmc: bx2-4x16
        aws: m6g.xlarge
    - name: "iscsi sanity"
      suite: suites/umbrella/iscsi/iscsi_sanity.yaml
      global-conf: conf/umbrella/iscsi/ceph_iscsi_functional.yaml
      vm-size:
        ibmc: bx2-4x16
      build:
        - ibm
    - name: "tier-1 rbd_mirror"
      suite: suites/umbrella/rbd/tier-1_rbd_mirror.yaml
      global-conf: conf/umbrella/rbd/5-node-2-clusters.yaml
    - name: "tier-1 rgw"
      suite: suites/umbrella/rgw/tier-1_rgw.yaml
      global-conf: conf/umbrella/rgw/tier-0_rgw.yaml
    - name: "tier-1 rgw multisite"
      suite: suites/umbrella/rgw/tier-1_rgw_multisite.yaml
      global-conf: conf/umbrella/rgw/rgw_multisite_ec2+2.yaml
    - name: "tier-2 rgw ms upgrade 10xsanity to 10xlatest"
      suite: suites/umbrella/rgw/tier-2_rgw_ms_upgrade_10xsanity_to_10xlatest.yaml
      global-conf: conf/umbrella/rgw/rgw_multisite_ec2+2.yaml
    - name: "tier-2 rgw upgrade 10xsanity to 10xlatest"
      suite: suites/umbrella/rgw/tier-2_rgw_upgrade_10xsanity_to_10xlatest.yaml
      global-conf: conf/umbrella/rgw/tier-0_rgw.yaml
    - name: "Tier-1 CephFS Test"
      suite: suites/umbrella/cephfs/tier-0_fs.yaml
      global-conf: conf/umbrella/cephfs/tier-2_cephfs_7-node-cluster.yaml
    - name: "Tier-0 NFS Ganesha"
      suite: suites/umbrella/nfs/tier0-nfs-ganesha-sanity.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-0 NFS Ganesha v3"
      suite: suites/umbrella/nfs/tier0-nfs-ganesha-v3-sanity.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-0 NFS Ganesha v4"
      suite: suites/umbrella/nfs/tier0-nfs-ganesha-vers-4-2-sanity.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "Tier-0 NFS Ganesha functional Sanity"
      suite: suites/umbrella/nfs/tier0-nfs-ganesha-func-sanity.yaml
      global-conf: conf/umbrella/nfs/1admin-7node-3client.yaml
    - name: "SMB Sanity Tier-0 Test Cases"
      suite: suites/umbrella/smb/tier-0-smb.yaml
      global-conf: conf/umbrella/smb/1admin-4node-1client-cluster.yaml
      build:
        - ibm
    - name: "Tier-1 DMFG Service Apply Spec"
      suite: suites/umbrella/cephadm/tier1-service-apply-spec.yaml
      global-conf: conf/umbrella/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Tier-2 Cephadm Agent Comprehensive Tests"
      suite: suites/umbrella/cephadm/tier2-cephadm-agent.yaml
      global-conf: conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml

