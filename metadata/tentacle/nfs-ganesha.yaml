regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Tier-1 NFS Ganesha Phase-2 v4.2"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-phase2-v4-2.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha v3"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-v3.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha v4.2"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-v4-2.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha QoS"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-qos.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha BYOK"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-byok.yaml
      global-conf: conf/tentacle/nfs/1admin-7node-3client.yaml
    - name: "Tier-1 NFS Ganesha GRPC"
      suite: suites/tentacle/nfs/tier1-nfs-ganesha-grpc.yaml
