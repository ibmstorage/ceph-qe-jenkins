regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    ## Cephadm-ansible boostrap module does not support the --automatically-accept-license flag.
    ## Hence these suites will fail on IBM Ceph Storage 9.1 builds.
    ## Therefore, cephadm-ansible test suites that depend on it are temporarily commented out.
    ## These suites will be re-enabled once the support is added; QE BZ IBMCEPH-15709
    
    # - name: "Test DMFG Tier-1 Cephadm Ansible Wrapper Bootstrap with Registry Details"
    #  suite: suites/tentacle/cephadm/tier1-cephadm-ansible-wrapper-bootstrap-with-registry-details.yaml
    #  global-conf: conf/tentacle/smoke/1admin-4node-1client-bvt.yaml
    # - name: "Test DMFG Tier-1 Cephadm Ansible Wrapper Bootstrap with Custom SSH"
    #  suite: suites/tentacle/cephadm/tier1-cephadm-ansible-wrapper-bootstrap-with-custom-ssh.yaml
    #  global-conf: conf/tentacle/smoke/1admin-4node-1client-bvt.yaml
    - name: "Test DMFG Tier-1 Ceph API Auth"
      suite: suites/tentacle/cephmgr/tier1-cephapi-auth-api.yaml
      global-conf: conf/tentacle/cephmgr/1admin-4node-1client-ceph-mgr.yaml
    - name: "Test DMFG Tier-1 Cehadm Ansible Wrapper Modules"
      suite: suites/tentacle/cephadm/tier1-cephadm-ansible-wrapper-modules.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 Cephadm Clients"
      suite: suites/tentacle/cephadm/tier1-cephadm-clients.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 Remove Cluster"
      suite: suites/tentacle/cephadm/tier1-remove-cluster.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 OS Tuning Profiles"
      suite: suites/tentacle/cephadm/tier1-os-tuning-profiles.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 Mix OS Deployment"
      suite: suites/tentacle/cephadm/tier1-mix-os-deployment.yaml
      global-conf: conf/tentacle/cephadm/1admin-4node-1client-mix-os.yaml
    - name: "Test DMFG Tier-1 Container CLI Args"
      suite: suites/tentacle/cephadm/tier1-container-cli-args.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 SSL Dashboard Port"
      suite: suites/tentacle/cephadm/tier1-ssl-dashboard-port.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-1 Node-exporter Operations"
      suite: suites/tentacle/cephadm/tier1_node_exporter_operation.yaml
      global-conf: conf/tentacle/cephadm/2admin-5node-1client-cluster.yaml
    # - name: "Test DMFG Tier-1 OSD Crush Device Class"
    #  suite: suites/tentacle/cephadm/tier1-osd-crush-device-class.yaml
    #  global-conf: conf/tentacle/cephadm/1admin-4node-1client-cluster.yaml
    # - name: "Test DMFG Tier-2 Bootstrap with Spec"
    #  suite: suites/tentacle/cephadm/tier2-bootstrap-along-with-spec-file.yaml
    #  global-conf: conf/tentacle/cephadm/1admin-4node-1client-cluster.yaml
    - name: "Test DMFG Tier-2 Ceph Volume"
      suite: suites/tentacle/ceph_volume/tier2-ceph-volume.yaml
      global-conf: conf/tentacle/ceph_volume/1admin-4node-1client-ceph-volume.yaml
    # - name: "Test DMFG Tier-2 Permissive Mode Scenarios"
    #  suite: suites/tentacle/cephadm/tier2-permissive-mode-scenarios.yaml
    #  global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-2 RGW with Warn State"
      suite: suites/tentacle/cephadm/tier2-rgw-with-warn-state.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-2 Verify Custom Container"
      suite: suites/tentacle/cephadm/tier2-verify-custom-container.yaml
      global-conf: conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    - name: "Test DMFG Tier-2 OSD Scenarios"
      suite: suites/tentacle/cephadm/tier2-osd-scenarios.yaml
      global-conf: conf/tentacle/cephadm/1admin-4node-1client-cluster.yaml

    ## IBMC cloud provider support is not yet implemented.
    ## Therefore, ceph-volume test suites that depend on it are temporarily commented out.
    ## These suites will be re-enabled once IBMC support is added.

    # - name: "Test DMFG Tier-1 Ceph-Volume Sanity"
    #   suite: suites/tentacle/ceph_volume/tier1-ceph-volume-sanity.yaml
    #   global-conf: conf/tentacle/ceph_volume/1admin-4node-1client-ceph-volume.yaml
    # - name: "Test DMFG Tier-2 Ceph-Volume Redeploy"
    #   suite: suites/tentacle/ceph_volume/tier2-ceph-volume-redeploy.yaml
    #   global-conf: conf/tentacle/ceph_volume/1admin-1client-5node-single-volume.yaml
    # - name: "Test DMFG Tier-2 Ceph-Volume Non-collocated"
    #   suite: suites/tentacle/ceph_volume/tier2-ceph-volume-non-collocated.yaml
    #   global-conf: conf/tentacle/ceph_volume/1admin-1client-5node-single-volume.yaml
    # - name: "Test DMFG Tier-2 Ceph-Volume lvm"
    #   suite: suites/tentacle/ceph_volume/tier2-ceph-volume-lvm.yaml
    #   global-conf: conf/tentacle/ceph_volume/2admin-5node-1client.yaml
    - name: "Test DMFG Tier-4 Service Operations"
      suite: suites/tentacle/cephadm/tier4-service-operations.yaml
      global-conf: conf/tentacle/cephadm/1admin-4node-1client-cluster.yaml

