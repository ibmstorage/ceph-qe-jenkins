rook_defaults:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "RBD common with Rook defaults"
      suite: suites/tentacle/rook/rbd_rook_common.yaml
      global-conf: conf/tentacle/rbd/4-node-cluster-with-1-client.yaml
    - name: "RBD mirror common with Rook defaults"
      suite: suites/tentacle/rook/rbd_mirror_rook_common.yaml
      global-conf: conf/tentacle/rbd/5-node-2-clusters.yaml
    - name: "RGW sanity with Rook defaults"
      suite: suites/tentacle/rook/sanity_rgw.yaml
      global-conf: conf/tentacle/rgw/tier-0_rgw.yaml
      inventory:
        ibmc:
          rhel-9: conf/inventory/ibm-eu-rhel-9-latest-rgw.yaml
          rhel-10: conf/inventory/ibm-eu-rhel-10-latest-rgw.yaml
      platform:
        - rhel-9
        - rhel-10
    - name: "RGW multisite sanity with Rook defaults"
      suite: suites/tentacle/rook/sanity_rgw_multisite.yaml
      global-conf: conf/tentacle/rgw/rgw_multisite.yaml
      inventory:
        ibmc:
          rhel-9: conf/inventory/ibm-eu-rhel-9-latest-rgw.yaml
          rhel-10: conf/inventory/ibm-eu-rhel-10-latest-rgw.yaml
      platform:
        - rhel-9
        - rhel-10
    - name: "SMB DMFG sanity with Rook defaults"
      suite: suites/tentacle/rook/sanity_dmfg_smb.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
    - name: "NFS Ganesha Tests with Rook Defaults"
      suite: suites/tentacle/rook/nfs-ganesha-rook.yaml
      global-conf: conf/tentacle/rook/nfs_cephfs_7-node-rook.yaml
    - name: "CephFS tests with Rook Defaults"
      suite: suites/tentacle/rook/cephfs-rook.yaml
      global-conf: conf/tentacle/rook/nfs_cephfs_7-node-rook.yaml
    - name: "RADOS tests with Rook Defaults"
      suite: suites/tentacle/rook/sanity-rados-rook.yaml
      global-conf: conf/tentacle/rados/4-node-ec-cluster-1-client.yaml
