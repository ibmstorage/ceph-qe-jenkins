regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Test SMB Tier-1 Test Cases"
      suite: suites/tentacle/smb/tier-1-smb.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB AD Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-ad-dc.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB CTDB Clustering Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-ctdb-clustering.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB VSS Snapshot Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-vss.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB Tier-2 Test Cases"
      suite: suites/tentacle/smb/tier-2-smb.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB Firewall Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-firewall.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB Torture Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-smbtorture.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB Colocation Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-colocation.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB QoS Test Cases"
      suite: suites/tentacle/smb/tier-1-smb-qos.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      vm-size: cx2-8x16
    - name: "Test SMB Service Sepration"
      suite: suites/tentacle/smb/tier-1-smb-exo.yaml
      global-conf: conf/tentacle/smb/2admin-8node-2client-2cluster.yaml
      vm-size: cx2-8x16

upgrade:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: "Test SMB upgrade IBMSC 8x to 9x latest"
      suite: suites/tentacle/smb/tier-0-smb-upgrade-ibm-8x-to-9x-latest.yaml
      global-conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
      platform:
        - rhel-9
      build:
        - ibm
