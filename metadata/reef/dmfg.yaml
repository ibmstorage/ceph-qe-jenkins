upgrade:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: tier2 upgrade rhcs staggered 6x to 7x
      suite: suites/reef/upgrades/tier2-upgrade-rhcs-staggered-6x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - rh
    - name: tier2 upgrade rhcs standby mgr 5x to 7x
      suite: suites/reef/upgrades/tier-2-upgrade-rhcs-5x-to-7x-standby-mgr.yaml
      global-conf: conf/reef/upgrades/1admin-3node-1client-3mgr-upgrade.yaml
      build:
        - rh
    - name: tier1 upgrade rhcs 6x to 7x
      suite: suites/reef/upgrades/tier1-upgrade-rhcs-6x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - rh
    - name: tier1 upgrade rhcs 5x to 7x
      suite: suites/reef/upgrades/tier1-upgrade-rhcs-5x-to-7x.yaml
      global-conf: conf/6-node-cluster-with-1-client.yaml
      build:
        - rh
    - name: tier1 upgrade rhcs 5x to 7x mix os
      suite: suites/reef/upgrades/tier1-upgrade-rhcs-5x-to-7x-mix-os.yaml
      global-conf: conf/reef/upgrades/upgrade_8-node-cluster_mix_os.yaml
      build:
        - rh
    - name: tier2 upgrade rhcs staggered 5x to 7x
      suite: suites/reef/upgrades/tier2-upgrade-rhcs-staggered-5x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - rh
    - name: tier1 upgrade rhcs 7x to 7x latest
      suite: suites/reef/upgrades/tier1-upgrade-rhcs-7x-to-7x-latest.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - rh
    - name: tier1 upgrade ibm 6x to 7x
      suite: suites/reef/upgrades/tier1-upgrade-ibm-6x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - ibm
    - name: tier1 upgrade ibm 5x to 7x
      suite: suites/reef/upgrades/tier1-upgrade-ibm-5x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - ibm
    - name: tier1 upgrade ibm 5x to 7x mix os
      suite: suites/reef/upgrades/tier1-upgrade-ibm-5x-to-7x-mix-os.yaml
      global-conf: conf/reef/upgrades/upgrade_8-node-cluster_mix_os.yaml
      build:
        - ibm
    - name: tier2 upgrade ibm staggered 5x to 7x
      suite: suites/reef/upgrades/tier2-upgrade-ibm-staggered-5x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - ibm
    - name: tier2 upgrade ibm staggered 6x to 7x
      suite: suites/reef/upgrades/tier2-upgrade-ibm-staggered-6x-to-7x.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - ibm
    - name: tier1 upgrade ibm 7x to 7x latest
      suite: suites/reef/upgrades/tier1-upgrade-ibm-7x-to-7x-latest.yaml
      global-conf: conf/reef/upgrades/upgrade_4-node-cluster.yaml
      build:
        - ibm

regression:
  metadata:
    cloud:
      - ibmc
      - aws
  suites:
    - name: tier1 cephadm ansible wrapper bootstrap with registry details
      suite: suites/reef/cephadm/tier1-cephadm-ansible-wrapper-bootstrap-with-registry-details.yaml
      global-conf: conf/reef/smoke/1admin-4node-1client-bvt.yaml
    - name: tier-2 bootstrap along with spec file
      suite: suites/reef/cephadm/tier-2-bootstrap-along-with-spec-file.yaml
      global-conf: conf/reef/cephadm/1admin-4node-1client-cluster.yaml
    - name: tier1 cephadm ansible wrapper bootstrap with custom ssh
      suite: suites/reef/cephadm/tier1-cephadm-ansible-wrapper-bootstrap-with-custom-ssh.yaml
      global-conf: conf/reef/smoke/1admin-4node-1client-bvt.yaml
      build:
        - rh
    - name: tier1 cephapi auth api
      suite: suites/reef/mgr/tier-1-cephapi-auth-api.yaml
      global-conf: conf/reef/mgr/3node-1client-cluster.yaml
    - name: tier1 cephadm ansible wrapper modules
      suite: suites/reef/cephadm/tier1-cephadm-ansible-wrapper-modules.yaml
      global-conf: conf/reef/cephadm/2admin-3node-1rgw-1client-sanity.yaml
    # - name: tier2 ceph-volume
