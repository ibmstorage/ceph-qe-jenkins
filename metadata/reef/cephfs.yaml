upgrade:
  metadata:
    cloud:
      - ibmc
  suites:
    - name: "Test Cephfs Upgrade 7x Latest to 7.1x Latest"
      suite: suites/reef/cephfs/tier-0_cephfs_upgrade_7x_latest_to_71x_latest.yaml
      global-conf: conf/reef/cephfs/tier-2_cephfs_upgrade.yaml
    - name: "Test Cephfs Upgrade 61 to 7x"
      suite: suites/reef/cephfs/tier-0_cephfs_upgrade_61_to_7x.yaml
      global-conf: conf/reef/cephfs/tier-2_cephfs_upgrade.yaml
    - name: "Test Cephfs Upgrade 5x to 7x"
      suite: suites/reef/cephfs/tier-0_cephfs_upgrade_5x_to_7x.yaml
      global-conf: conf/reef/cephfs/tier-2_cephfs_upgrade.yaml
    - name: "Test Cephfs Mirror Upgrade 5x to 6x to 7x"
      suite: suites/reef/cephfs/tier-0_cephfs_mirrror_upgrade_5x_to_6x_to_7x.yaml
      global-conf: conf/reef/cephfs/tier-1_cephfs_mirror.yaml
