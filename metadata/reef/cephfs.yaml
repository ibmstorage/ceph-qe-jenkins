regression:
  metadata:
    cloud:
      - ibmc
  suites:
      - name: "Tier-0 Basic FS Tests"
        suite: suites/reef/cephfs/tier-2_fs.yaml
        global-conf: conf/reef/cephfs/tier-0_fs.yaml
      - name: "Tier-0 Multi-FS Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-multifs.yaml
        global-conf: conf/reef/cephfs/tier-0_fs.yaml
      - name: "Tier-0 Quota Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-quota.yaml
        global-conf: conf/reef/cephfs/tier-0_fs.yaml
      - name: "Tier-0 Snapshot Clone Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-snapshot-clone.yaml
        global-conf: conf/reef/cephfs/tier-0_fs.yaml
      - name: "Tier-1 Basic FS Tests"
        suite: suites/reef/cephfs/tier-1_fs.yaml
        global-conf: conf/reef/cephfs/tier-1_fs.yaml
      - name: "Tier-1 Cephfs CG Quiesce Tests"
        suite: suites/reef/cephfs/tier-1_cephfs_cg_quiesce.yaml
        global-conf: conf/reef/cephfs/tier-1_fs.yaml
      - name: "Tier-1 Cephfs Mirroring Tests"
        suite: suites/reef/cephfs/tier-1_cephfs_mirror.yaml
        global-conf: conf/reef/cephfs/tier-1_cephfs_mirror.yaml
      - name: "Tier-2 File and Directory Layout Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test_file_and_dir_layout.yaml
        global-conf: conf/reef/cephfs/tier-2_cephfs_9-node-cluster.yaml
      - name: "Tier-2 Volume Management Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-volume-management.yaml
        global-conf: conf/reef/cephfs/tier-2_cephfs_9-node-cluster.yaml
      - name: "Tier-2 NFS Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-nfs.yaml
        global-conf: conf/reef/cephfs/tier-2_cephfs_9-node-cluster.yaml
      - name: "Tier-2 Clients Tests"
        suite: suites/reef/cephfs/tier-2_cephfs_test-clients.yaml
        global-conf: conf/reef/cephfs/tier-2_cephfs_9-node-cluster.yaml


